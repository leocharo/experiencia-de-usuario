<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Mis Manos Hablarán</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            color: #1e293b;
        }
        
        .sidebar {
            width: 280px;
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            color: white;
            height: 100vh;
            position: sticky;
            top: 0;
        }
        
        .sidebar-header {
            padding: 30px 25px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .sidebar-header h2 {
            font-size: 22px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .content {
            flex-grow: 1;
            padding: 40px;
            overflow-y: auto;
        }
        
        .header {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            margin-bottom: 30px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }
        
        .stat-card-value {
            font-size: 32px;
            font-weight: 800;
            color: #4f46e5;
            margin-top: 5px;
        }
        
        .table-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }
        
        .table-header {
            padding: 20px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #f1f5f9;
        }
        
        .user-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .user-table th {
            padding: 15px 25px;
            text-align: left;
            background: #f8fafc;
            color: #64748b;
            font-size: 12px;
            text-transform: uppercase;
        }
        
        .user-table td {
            padding: 15px 25px;
            border-bottom: 1px solid #f1f5f9;
        }
        
        .badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .badge-level-1 {
            background: #e0f2fe;
            color: #0369a1;
        }
        
        .badge-level-2 {
            background: #fef3c7;
            color: #92400e;
        }
        
        .badge-level-3 {
            background: #fae8ff;
            color: #86198f;
        }
        
        .badge-level-4 {
            background: #dcfce7;
            color: #16a34a;
            border: 1px solid #16a34a;
        }
        
        .btn {
            padding: 8px 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: 0.2s;
        }
        
        .btn-view {
            background: #eff6ff;
            color: #2563eb;
        }
        
        .btn-danger {
            background: #fee2e2;
            color: #dc2626;
        }
        
        .btn-refresh {
            background: #10b981;
            color: white;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-refresh:hover {
            background: #059669;
        }
        
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            visibility: hidden;
            opacity: 0;
            transition: 0.3s;
        }
        
        .modal-overlay.active {
            visibility: visible;
            opacity: 1;
        }
        
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 20px;
            width: 450px;
            text-align: center;
        }
    </style>
</head>

<body>
    <nav class="sidebar">
        <div class="sidebar-header">
            <h2>🖐️ Admin LSM</h2>
        </div>
        <div style="padding: 20px; color: #94a3b8; font-size: 14px;">GESTIÓN</div>
        <div style="padding: 10px 25px; background: rgba(255,255,255,0.1); cursor: pointer;">Usuarios</div>
    </nav>

    <main class="content">
        <div class="header">
            <h1>Dashboard de Control</h1>
            <p>Monitoreo de progreso de los estudiantes.</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <p>Total Alumnos</p>
                <div id="stat-total-users" class="stat-card-value">0</div>
            </div>
            <div class="stat-card">
                <p>Nivel Promedio</p>
                <div id="stat-avg-level" class="stat-card-value">0</div>
            </div>
            <div class="stat-card">
                <p>Graduados</p>
                <div id="stat-completed" class="stat-card-value">0</div>
            </div>
        </div>

        <div class="table-container">
            <div class="table-header">
                <h3 style="font-size: 18px;">Lista de Estudiantes</h3>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="admin-search" style="padding: 8px; border: 1px solid #ddd; border-radius: 8px;" placeholder="Buscar...">
                    <button id="refresh-btn" class="btn btn-refresh">
                        <span>🔄</span> Actualizar
                    </button>
                </div>
            </div>
            <table class="user-table">
                <thead>
                    <tr>
                        <th>Alumno</th>
                        <th>Correo</th>
                        <th>Nivel Real</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="users-list"></tbody>
            </table>
        </div>
    </main>

    <div id="view-modal" class="modal-overlay">
        <div class="modal-content">
            <h3 id="modal-user-name" style="margin-bottom: 20px; font-size: 24px;">Detalles</h3>
            <div id="levels-details-container"></div>
            <button class="btn btn-view" style="margin-top: 25px; width: 100%; padding: 12px;" onclick="closeModals()">Cerrar</button>
        </div>
    </div>

    <div id="delete-modal" class="modal-overlay">
        <div class="modal-content">
            <h3 style="margin-bottom: 15px;">¿Eliminar usuario?</h3>
            <p style="color: #64748b; margin-bottom: 20px;">Esta acción es permanente.</p>
            <div style="display: flex; gap: 10px;">
                <button class="btn btn-view" style="flex: 1;" onclick="closeModals()">Cancelar</button>
                <button id="confirm-delete-btn" class="btn btn-danger" style="flex: 1;">Eliminar Ahora</button>
            </div>
        </div>
    </div>

    <script type="module" src="admin.js"></script>
</body>

</html>
